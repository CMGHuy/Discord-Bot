[pytest]
# Keep the default invocation identical to what the repo already documents
# (`python -m pytest tests/ -q`). Nothing here changes test semantics.
testpaths = tests
addopts = -q

# Without this, pytest can collect the three full repo copies under
# .claude/worktrees/ and run a different branch's tests alongside this one.
norecursedirs =
    .git
    .claude
    .superpowers
    market_data
    data
    logs
    docs
    deploy
    exports
    __pycache__
    *.egg-info

# Parallelism is OPT-IN, not in addopts on purpose:
#   python -m pytest -n auto        # full suite across all cores
# Reasons it is not the default:
#   - Concurrent Claude sessions share this working tree; -n auto saturating all
#     cores while a multi-hour walk-forward backtest runs makes both slower.
#   - Some tests here are wall-clock/expiry sensitive (see the known-failing
#     test_flag_on_polls_open_plans); confirm the baseline serially before
#     trusting a parallel run's result.

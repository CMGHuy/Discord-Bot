[pytest]
# Keep the default invocation identical to what the repo already documents
# (`python -m pytest tests/ -q`). Nothing here changes test semantics.
testpaths = tests
addopts = -q

# Without this, pytest can collect the three full repo copies under
# .claude/worktrees/ and run a different branch's tests alongside this one.
norecursedirs =
    .git
    .claude
    .superpowers
    market_data
    data
    logs
    docs
    deploy
    exports
    __pycache__
    *.egg-info

markers =
    slow: heavy render/backtest test (~85% of suite runtime); excluded from the fast tier

# Parallelism is OPT-IN, not in addopts on purpose:
#   python scripts/testrun.py full  # preferred: -n 4, quiet verdict, logged output
#   python -m pytest -n 4           # raw equivalent
# Reasons it is not the default:
#   - Concurrent Claude sessions share this working tree; saturating all cores
#     while a multi-hour walk-forward backtest runs makes both slower.
#   - Some tests here are wall-clock/expiry sensitive; confirm a baseline
#     serially before trusting a parallel run's result.
#
# Use -n 4, NOT -n auto. Measured on this box (12 logical cores): serial 180.4s,
# -n 4 40.2s, -n auto 60.0s. Over-subscribing costs ~20s in worker startup and
# contention. See docs/claude/testing-cost.md to re-derive on other hardware.

{% extends "base.html" %}
{% block body %}
{# ===========================================================================
   Dashboard shell. Everything here is parsed ONCE per page load: the toolbar,
   the Trade History card, and the <script> that drives all of it.

   Only #dashboard-fragment is re-fetched on the auto-refresh poll. Trade
   History deliberately sits outside it -- the table is filled by
   /api/trade-history from first paint onward, so re-rendering its rows and
   its filter dropdowns on every 5s tick only ever produced markup the browser
   threw away.
   =========================================================================== #}
<div class="toolbar">
  <div id="dashboard-mode-toggle" title="Which trades the stat cards/tables below summarize"
       style="display:flex; border:1px solid #2a2e3d; border-radius:8px; overflow:hidden;">
    <button type="button" class="btn ghost small dashboard-mode-btn" data-mode="active"
            title="Today's new trades, plus every still-open position from any day">Today + Open</button>
    <button type="button" class="btn ghost small dashboard-mode-btn" data-mode="today"
            title="Only today's activity -- trades opened or closed today">Today only</button>
    <button type="button" class="btn ghost small dashboard-mode-btn" data-mode="all"
            title="Every trade ever logged, no date filtering">All days</button>
  </div>
  <label class="muted" style="display:flex;align-items:center;gap:6px;">
    <input type="checkbox" id="auto-refresh" checked> Auto-refresh every {{ dashboard_refresh_seconds }}s
  </label>
  <button type="button" class="secondary small" id="refresh-now">&#8635; Refresh now</button>
  <span class="muted" id="refresh-status" style="font-size:12px;"></span>

  <!-- Bot liveness indicator: green = bot process active, red = offline/hung -->
  <span style="display:flex; align-items:center; gap:7px; margin-left:4px;" title="" id="bot-status-wrap">
    <span id="bot-status-dot" class="trade-status-dot"
          style="--status-color: #5a6275; --blink-duration: 2.2s;"></span>
    <span id="bot-status-label" class="muted" style="font-size:12px;">Bot: checking…</span>
  </span>

  <div style="margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
    <span id="scan-pause-badge" class="pill" style="display:none;"></span>
    {# action + data-confirm are set by dashboard.js once it knows whether
       scanning is currently paused. #}
    <form method="post" id="pause-resume-form" style="margin:0;">
      <button type="submit" class="secondary small" id="pause-resume-btn">…</button>
    </form>
    <form method="post" action="{{ url_for('trigger_scan') }}" style="margin:0;">
      <button type="submit" class="small" id="trigger-btn" title="Queues a !check scan — the bot will pick it up within 30 seconds">
        🔍 Run !check now
      </button>
    </form>
    <form method="post" action="{{ url_for('stop_scan') }}" style="margin:0;"
          data-confirm="Stop the scan currently running?">
      <button type="submit" class="danger small" id="stop-btn" disabled
              title="Stop the scan currently in progress (only enabled while one is running)">
        🛑 Stop scan
      </button>
    </form>
    <span id="trigger-status" class="muted" style="font-size:12px;"></span>
    <a href="{{ url_for('export_trades_csv') }}" class="btn secondary small">&#11015; Export CSV</a>
  </div>
</div>

<div style="margin-bottom:16px; padding:10px 16px; background:#0f1219; border:1px solid #1f2330;
            border-left: 3px solid #2558c9; border-radius:8px; font-size:12.5px; color:#7a8299; line-height:1.5;">
  <strong style="color:#9aa3b8;">What appears here:</strong>
  Only trades that meet <em>every</em> configured requirement (min reward, stop distance, risk:reward,
  min strategies confirmed, min confidence) are logged here as paper trades.
  Trade plans shown by <code>!check</code> that don't clear all requirements appear in Discord
  but are <strong>not</strong> logged &mdash; they&rsquo;re marked in bold red in the Discord embed.
  The automatic background scan only ever posts and logs fully-qualifying setups.
</div>

<div id="dashboard-fragment">{{ fragment | safe }}</div>

{# ── Trade history ───────────────────────────────────────────────────────── #}
<div class="card">
  <p class="card-title" style="margin-bottom:14px;">
    Trade history
    <span class="muted" style="font-size:12px;font-weight:400;text-transform:none;letter-spacing:0;margin-left:8px;">
      <span id="ct-total-count">{{ closed_trades_total }}</span> closed trade(s) · win/loss/manually-closed
      {%- if dashboard_mode in ('today', 'active') %} · closed today{% endif %}
    </span>
  </p>

  {# ── Filter + pagination toolbar ── #}
  <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;">
    <select id="ct-filter-outcome" class="ct-filter" data-filter="outcome"
            style="background:#13161d;color:#dde1ea;border:1px solid #1f2330;border-radius:6px;padding:4px 8px;font-size:12px;">
      <option value="">All outcomes</option>
      <option value="win">WIN</option>
      <option value="loss">LOSS</option>
      <option value="closed">CLOSED</option>
    </select>
    <select id="ct-filter-ticker" class="ct-filter" data-filter="ticker"
            style="background:#13161d;color:#dde1ea;border:1px solid #1f2330;border-radius:6px;padding:4px 8px;font-size:12px;">
      <option value="">All tickers</option>
      {%- for v in closed_trade_filter_options.ticker %}
      <option value="{{ v }}">{{ v }}</option>
      {%- endfor %}
    </select>
    <select id="ct-filter-strategy" class="ct-filter" data-filter="strategy"
            style="background:#13161d;color:#dde1ea;border:1px solid #1f2330;border-radius:6px;padding:4px 8px;font-size:12px;">
      <option value="">All strategies</option>
      {%- for v in closed_trade_filter_options.strategy %}
      <option value="{{ v }}">{{ v }}</option>
      {%- endfor %}
    </select>
    <select id="ct-filter-horizon" class="ct-filter" data-filter="horizon"
            style="background:#13161d;color:#dde1ea;border:1px solid #1f2330;border-radius:6px;padding:4px 8px;font-size:12px;">
      <option value="">All horizons</option>
      {%- for v in closed_trade_filter_options.horizon %}
      <option value="{{ v }}">{{ v }}</option>
      {%- endfor %}
    </select>
    <select id="ct-filter-dir" class="ct-filter" data-filter="dir"
            style="background:#13161d;color:#dde1ea;border:1px solid #1f2330;border-radius:6px;padding:4px 8px;font-size:12px;">
      <option value="">All directions</option>
      <option value="bullish">▲ Long</option>
      <option value="bearish">▼ Short</option>
    </select>
    <select id="ct-filter-conf" class="ct-filter" data-filter="conf"
            style="background:#13161d;color:#dde1ea;border:1px solid #1f2330;border-radius:6px;padding:4px 8px;font-size:12px;">
      <option value="">All confidence</option>
      <option value="1">Lv1</option><option value="2">Lv2</option><option value="3">Lv3</option>
      <option value="4">Lv4</option><option value="5">Lv5</option>
    </select>
    <button type="button" id="ct-reset-filters" class="secondary small"
            style="font-size:12px;padding:4px 10px;">✕ Reset</button>
    <span style="flex:1;"></span>
    <span class="density-toggle" id="ct-density-toggle" title="Compact hides the analytical columns (strategy, horizon, confidence, entry/exit, P&L%, opened) -- they are still on the Performance page and each trade's detail page.">
      <button type="button" data-density="compact">Compact</button>
      <button type="button" data-density="full">Full</button>
    </span>
    <label class="muted" style="font-size:12px;display:flex;align-items:center;gap:5px;">
      Show
      <select id="ct-per-page"
              style="background:#13161d;color:#dde1ea;border:1px solid #1f2330;border-radius:6px;padding:4px 8px;font-size:12px;">
        <option value="10">10</option>
        <option value="25">25</option>
        <option value="50">50</option>
        <option value="0">All</option>
      </select>
      per page
    </label>
  </div>

  <div class="table-density density-compact" data-density-for="ct">
  <div style="overflow-x:auto;">
  <table id="closed-trades-table" style="width:100%;">
    <thead>
    <tr>
      <th style="width:26px;">#</th>
      <th data-col-id="outcome">Outcome <span class="sort-arrow" data-col-id="outcome"></span></th>
      <th data-col-id="ticker">Ticker <span class="sort-arrow" data-col-id="ticker"></span></th>
      <th class="col-full" data-col-id="strategy" title="Primary confirming method">Strategy <span class="sort-arrow" data-col-id="strategy"></span></th>
      <th class="col-full" data-col-id="horizon">Horizon <span class="sort-arrow" data-col-id="horizon"></span></th>
      <th class="col-full" data-col-id="dir">Dir <span class="sort-arrow" data-col-id="dir"></span></th>
      <th class="col-full" data-col-id="conf">Conf <span class="sort-arrow" data-col-id="conf"></span></th>
      <th data-col-id="entry" class="col-full num">Entry <span class="sort-arrow" data-col-id="entry"></span></th>
      <th data-col-id="exit" class="col-full num">Exit <span class="sort-arrow" data-col-id="exit"></span></th>
      <th data-col-id="pnlpct" class="col-full num" title="Realized P&L % vs entry">P&amp;L% <span class="sort-arrow" data-col-id="pnlpct"></span></th>
      <th data-col-id="gainloss" class="num" title="Realized gain/loss in account currency, based on the position size snapshotted when the trade was opened">Gain/Loss <span class="sort-arrow" data-col-id="gainloss"></span></th>
      <th data-col-id="r" class="num" title="Realized R-multiple">R <span class="sort-arrow" data-col-id="r"></span></th>
      <th data-col-id="days" class="num" title="Holding period -- time held, from open to close, down to the minute">Held <span class="sort-arrow" data-col-id="days"></span></th>
      <th class="col-full" data-col-id="opened">Opened <span class="sort-arrow" data-col-id="opened"></span></th>
      <th data-col-id="closed">Closed <span class="sort-arrow" data-col-id="closed"></span></th>
      <th style="width:60px;"></th>
    </tr>
    </thead>
    {# Rendered server-side for first paint so the table is populated straight
       away; dashboard.js re-requests page 1 on load (its remembered page size
       may differ from the 25 used here) and owns the tbody from then on. #}
    <tbody>
    {% include '_trade_history_rows.html' %}
    </tbody>
  </table>
  </div>

  {# ── Pagination bar ── #}
  <div style="display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap;">
    <button type="button" id="ct-prev" class="secondary small" style="padding:4px 12px;">‹ Prev</button>
    <span id="ct-page-info" class="muted" style="font-size:12px;">Page 1 / 1</span>
    <button type="button" id="ct-next" class="secondary small" style="padding:4px 12px;">Next ›</button>
    <span style="flex:1;"></span>
    <span id="ct-info" class="muted" style="font-size:12px;"></span>
  </div>
  </div>{# /table-density #}

  {% if closed_trades_total %}
  <div class="row" style="margin-top:12px;">
    <form method="post" action="{{ url_for('clear_trade_history') }}"
          data-confirm="Delete all {{ closed_trades_total }} closed trade record(s)? This cannot be undone.">
      <button type="submit" class="danger small">🗑 Clear all history</button>
    </form>
    <span class="muted" style="font-size:12px;">Open trades are not affected.</span>
  </div>
  {% else %}
  <p class="muted" style="text-align:center;padding:8px 0 0;">
    No closed trades yet. Trades are marked win/loss automatically when price hits stop or target.
  </p>
  {% endif %}
</div>

<div class="chart-modal" id="chart-modal" hidden>
  <div class="chart-modal-panel">
    <div class="toolbar"><b id="chart-modal-title"></b><span class="spacer"></span>
      <button type="button" class="btn ghost small" id="chart-modal-close">✕</button></div>
    <div class="swing-chart" id="chart-modal-chart" style="height:380px;"></div>
  </div>
</div>

{# Server values for static/dashboard.js. A static .js file is never run
   through Jinja, so URLs and settings are handed over as data rather than
   interpolated into the script. #}
<script type="application/json" id="dashboard-boot">
{{ {
  "fragmentUrl":   url_for('dashboard_fragment'),
  "historyUrl":    url_for('api_trade_history'),
  "scanStatusUrl": url_for('scan_status'),
  "pauseUrl":      url_for('pause_scan'),
  "resumeUrl":     url_for('resume_scan'),
  "refreshSeconds": dashboard_refresh_seconds,
  "mode":          dashboard_mode | default('active')
} | tojson }}
</script>
<script defer src="{{ url_for('static', filename='vendor/morphdom-umd.min.js') }}"></script>
<script defer src="{{ url_for('static', filename='dashboard.js') }}"></script>
{% endblock %}

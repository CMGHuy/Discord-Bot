<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Swing Bot Admin</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='tokens.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-card { width: 100%; max-width: 340px; text-align: center; }
  .login-card .brand-avatar {
    width: 88px; height: 88px; border-radius: 50%; object-fit: cover;
    background: #13161d; border: 3px solid #e2b25a;
    box-shadow: 0 0 0 3px #13161d, 0 3px 14px rgba(0,0,0,0.45);
    margin-bottom: 14px;
  }
  .login-card h1 { font-size: 18px; margin: 0 0 22px; color: #fff; }
  .login-card form { text-align: left; display: flex; flex-direction: column; gap: 16px; }
  .login-card button[type=submit] { margin-top: 4px; }
</style>
</head>
<body>
<div class="card login-card">
  <img class="brand-avatar"
       src="{{ url_for('static', filename='images/bot-profile.png') }}"
       srcset="{{ url_for('static', filename='images/bot-profile.png') }} 1x, {{ url_for('static', filename='images/bot-profile@2x.png') }} 2x"
       alt="">
  <h1>Swing Bot Admin</h1>
  {% if error %}
    <div class="banner err">{{ error }}</div>
  {% endif %}
  <form method="post" action="{{ url_for('login_submit') }}">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn">Sign in</button>
  </form>
</div>
</body>
</html>

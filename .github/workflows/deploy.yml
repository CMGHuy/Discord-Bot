name: Deploy Discord Swing Trade Bot to Hetzner

# Runs on every push to main, plus lets you trigger a deploy manually
# from the Actions tab (e.g. to re-deploy without a new commit, or to
# pick a different branch/tag via workflow_dispatch's ref selector).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # ── 1. Python: compile, then the actual test suite ─────────────────────────
  #
  # This job replaced two (`sanity-check` and `test`) that each did their own
  # full `pip install -r requirements.txt` — pandas, numpy, matplotlib, scipy,
  # discord.py — uncached, from scratch, in parallel, for the same result.
  # Installing the dependency set once is the single biggest saving available
  # here; everything the old sanity-check proved (does it import?) is proved
  # more thoroughly by the suite below failing at collection.
  #
  # It also dropped three hardcoded-list checks that had quietly stopped
  # earning their keep:
  #   - a "required symbol" list, subsumed by 1549 tests that call those
  #     symbols rather than merely assert they exist;
  #   - a "config key" list, subsumed by tests/admin/test_config_flags.py;
  #   - a "Flask route coverage" list of 23 endpoint names, which had drifted
  #     badly — the templates reference 44, and every `pages.*` one was
  #     missing, so it was passing while covering half of what it claimed.
  #     Now tests/admin/test_template_endpoints.py, which DERIVES the list
  #     from the templates and therefore cannot drift.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # uv, with its cache persisted between runs. Same installer the
      # Dockerfile uses, for the same reason: it resolves and downloads in
      # parallel instead of pip's one-at-a-time fetch. The cache key is the
      # pinned requirements file, so a run that changes no dependency
      # reinstalls nothing from the network.
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      # Catches truncated or corrupted files anywhere in the tree, including
      # modules nothing imports — which is the one thing the suite cannot do,
      # since it only reaches what it imports. Replaces a 15-line inline
      # heredoc that did the same thing with ast.parse.
      - name: Compile every module
        run: python -m compileall -q swingbot bot.py admin_ui.py scripts tests

      # Not piped: testrun.py exits 1 on failure, and a pipe would substitute
      # the exit status of whatever it fed.
      - name: Test suite
        run: python scripts/dev/testrun.py full

      # testrun.py prints a one-line verdict and writes the tracebacks to a
      # file -- which is right for a terminal and useless in CI, where a red
      # run gave nothing but a node id and no way to see why. Upload it.
      - name: Upload pytest log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-log
          path: .pytest-last-run.log
          if-no-files-found: warn
          retention-days: 7

  # ── 2b. The frontend ───────────────────────────────────────────────────────
  # The Angular suite and a real production build. The build is not redundant
  # with the Docker one below: this fails in ~1 minute with a readable
  # TypeScript error, where the Docker stage fails several minutes in with the
  # same error buried in build output. It also runs in parallel with `test`.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci`, not `npm install`: it installs exactly what package-lock
      # pins, which is the same guarantee the Dockerfile's frontend stage
      # relies on. If these two ever resolve different trees, the thing that
      # was tested is not the thing that ships.
      - name: Install
        run: npm ci

      - name: Unit tests
        run: npx ng test --watch=false

      - name: Production build
        run: npm run build

      # The base href is what NG54's blocker came down to: the bundle is
      # served from /app/, and index.html's asset URLs resolve against
      # whatever <base href> the build stamped. Asserting it on the real build
      # output catches a regression here rather than in a browser after
      # deploy. The runtime half -- that the server answers those URLs -- is
      # the SPA smoke test in the next job.
      - name: Built index.html points at the path Flask serves
        run: |
          INDEX=dist/frontend/browser/index.html
          test -f "$INDEX" || { echo "FAIL: no index.html at $INDEX"; exit 1; }
          if ! grep -q '<base href="/app/">' "$INDEX"; then
            echo "FAIL: expected <base href=\"/app/\"> in the built index.html"
            echo "Found: $(grep -o '<base[^>]*>' "$INDEX" || echo 'no <base> tag at all')"
            echo "spa.py serves the bundle from /app/. A mismatch means every"
            echo "asset 404s and the SPA renders a black screen."
            exit 1
          fi
          echo "OK: <base href=\"/app/\">"

  # ── 2c. Compose file sanity check ──────────────────────────────────────────
  # docker-compose.yml itself is never exercised by container-healthcheck
  # below -- that job proves the bot/admin containers work via plain
  # `docker run`, not `docker compose`. Nothing else in this pipeline would
  # catch a broken compose file, e.g. a required `${VAR:?...}` interpolation
  # on a profile-gated service breaking `docker compose config` for EVERY
  # profile, not just the one that needs the variable -- a real mistake made
  # (and caught locally, not in CI) while adding the `cloudflared` service;
  # see its comment in docker-compose.yml. Checked in both the default
  # profile (what a bare `docker compose up` resolves) and the `tunnel`
  # profile with a stub token (what the Hetzner server resolves once
  # CLOUDFLARE_TUNNEL_TOKEN/COMPOSE_PROFILES=tunnel are set in its .env), so
  # neither path can silently stop parsing.
  #
  # `bot`/`admin` both declare `env_file: - .env`, which -- unlike ${VAR}
  # substitution -- Compose requires to actually exist on disk to resolve
  # `config` at all, regardless of profile. This repo's real `.env` is
  # gitignored and never present on a fresh runner, so a stub copied from
  # `.env.example` (the same file `hetzner-setup.sh` seeds a fresh server
  # from) stands in for it here -- its actual values don't matter, only that
  # the file exists.
  compose-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Seed a stub .env (env_file requires it to exist)
        run: cp .env.example .env

      - name: Validate docker-compose.yml (default profile)
        run: docker compose config --quiet

      - name: Validate docker-compose.yml (tunnel profile)
        run: |
          COMPOSE_PROFILES=tunnel CLOUDFLARE_TUNNEL_TOKEN=ci-stub \
            docker compose config --quiet

  # ── 3. Docker build + container health ────────────────────────────────────
  # Builds the real Docker image (same Dockerfile used in production) and
  # actually starts both entrypoints to prove the containers come up
  # healthy.  Catches:
  #   - Dockerfile or requirements.txt breakage that a plain `pip install`
  #     in the earlier jobs wouldn't catch (e.g. system-level deps).
  #   - admin_ui.py failing to bind / Flask crashing on startup.
  #   - Auth gate regression (an unauthenticated browser must reach the SPA,
  #     which renders its own login form; /api/v1/* must still 401; wrong
  #     Basic Auth credentials still 401).
  #   - Any route returning 5xx instead of 200.
  #
  # It also PUBLISHES the image, and the ordering is the point: the artifact
  # that gets pushed is byte-identical to the one every check below ran
  # against. Build once, prove it, then push that -- never rebuild for the
  # push, which would ship an image nothing tested.
  container-healthcheck:
    needs: [test, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # GITHUB_TOKEN needs this to push to GHCR
    outputs:
      image: ${{ steps.imagename.outputs.image }}
      tag: ${{ steps.imagename.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      # GHCR rejects uppercase in a repository path and github.repository
      # preserves whatever case the repo was created with, so it cannot be
      # interpolated directly -- "Discord-Bot" would 400 on push.
      - name: Resolve image name
        id: imagename
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          # Immutable, and the thing the deploy pins. `latest` moves; this
          # never does, so a rollback is re-running deploy.sh with an older
          # tag and nothing else.
          TAG="sha-$(echo '${{ github.sha }}' | cut -c1-12)"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "Publishing as $IMAGE:$TAG"

      # BuildKit is required for --mount=type=cache in the Dockerfile.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Layer cache: keyed on Dockerfile + requirements.txt so a
      # source-only change reuses the cached pip/uv layer entirely.
      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: swing-bot:ci
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # Without the move the cache directory grows unboundedly across runs.
      - name: Rotate build cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # ── Entrypoint import checks (no network, no Discord token needed) ──
      - name: bot.py — entrypoint imports cleanly inside the image
        run: |
          docker run --rm \
            -e DISCORD_TOKEN=ci-stub \
            -e DISCORD_CHANNEL_TRADES_ID=0 \
            -e DISCORD_CHANNEL_TRADES_HISTORY_ID=0 \
            -e DISCORD_CHANNEL_RETROSPECTIVE_ID=0 \
            swing-bot:ci \
            python -c "import bot; print('bot.py: OK')"

      - name: admin_ui.py — entrypoint imports cleanly inside the image
        run: |
          docker run --rm \
            -e DISCORD_TOKEN=ci-stub \
            -e ADMIN_USERNAME=ci \
            -e ADMIN_PASSWORD=ci-secret \
            swing-bot:ci \
            python -c "from swingbot.admin.app import app, main; print('admin_ui.py: OK')"

      # ── Admin container smoke test ──────────────────────────────────────
      - name: Start admin container
        run: |
          docker run -d \
            --name swing-bot-admin-ci \
            -p 1234:1234 \
            -e DISCORD_TOKEN=ci-stub \
            -e DISCORD_CHANNEL_TRADES_ID=0 \
            -e DISCORD_CHANNEL_TRADES_HISTORY_ID=0 \
            -e DISCORD_CHANNEL_RETROSPECTIVE_ID=0 \
            -e ADMIN_USERNAME=ci \
            -e ADMIN_PASSWORD=ci-secret \
            -e ADMIN_PORT=1234 \
            swing-bot:ci \
            python admin_ui.py

      - name: Wait for admin UI to become available (up to 30 s)
        run: |
          echo "Waiting for admin UI on :1234..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:1234/ || true)
            if echo "$STATUS" | grep -qE "^(200|401|302)$"; then
              echo "Admin UI up — HTTP $STATUS after ${i}s"
              exit 0
            fi
            echo "  [${i}/30] HTTP '${STATUS:-no response}' — retrying in 1s..."
            sleep 1
          done
          echo "Admin UI did not respond within 30 s — dumping logs:"
          docker logs swing-bot-admin-ci
          exit 1

      # Release B deleted the Jinja login page. These two steps used to
      # assert that "/" redirects to /login and that /login renders -- both
      # now describe a UI that does not exist. What replaced them asserts the
      # property that actually matters and survives a UI change: the SPA
      # shell is servable to anyone (static assets; it renders its own login
      # form), while the DATA behind /api/v1/* is not.
      - name: Auth gate - unauthenticated browser request reaches the SPA
        run: |
          RESP=$(curl -s -D - -o /dev/null http://localhost:1234/)
          STATUS=$(echo "$RESP" | head -1 | grep -oE "[0-9]{3}")
          if [ "$STATUS" != "302" ]; then
            echo "FAIL: expected HTTP 302 from / without credentials, got HTTP $STATUS"
            exit 1
          fi
          LOCATION=$(echo "$RESP" | grep -i "^location:" | tr -d "\r" | awk '{print $2}')
          if ! echo "$LOCATION" | grep -q "/dashboard"; then
            echo "FAIL: expected Location to contain /dashboard, got: '$LOCATION'"
            exit 1
          fi
          echo "OK: unauthenticated request handed to the SPA at $LOCATION"

      - name: Auth gate - the API stays guarded without credentials
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:1234/api/v1/dashboard)
          if [ "$STATUS" != "401" ]; then
            echo "FAIL: expected HTTP 401 from /api/v1/dashboard without credentials, got HTTP $STATUS"
            exit 1
          fi
          echo "OK: /api/v1/* still requires auth"

      - name: Auth gate — wrong Basic Auth credentials must still return 401
        run: |
          # Against the API, not "/": Release B opened the front door so the
          # SPA can render its own login form, so "/" answers 302 for anyone.
          # The credential check belongs where the DATA is.
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -u "ci:wrong-password" http://localhost:1234/api/v1/dashboard)
          if [ "$STATUS" != "401" ]; then
            echo "FAIL: expected HTTP 401 with wrong Basic Auth credentials, got HTTP $STATUS"
            exit 1
          fi
          echo "OK: wrong credentials rejected with 401"

      - name: Route smoke test — all key pages must return 200 with valid credentials
        run: |
          AUTH="ci:ci-secret"
          FAILED=""

          check() {
            local url="$1" exp="$2" label="$3"
            local status
            status=$(curl -s -o /tmp/ci_body.html -w "%{http_code}" -u "$AUTH" "$url")
            if [ "$status" = "$exp" ]; then
              echo "  OK  $label  ->  HTTP $status"
            else
              echo "  FAIL $label: expected HTTP $exp, got HTTP $status"
              # Show the first error line from the response body to help debug
              grep -i "error\|traceback\|exception" /tmp/ci_body.html | head -3 || true
              FAILED="$FAILED $label"
            fi
          }

          # `/` is NOT 200: it redirects to the SPA's default workspace, and
          # the redirect is checked by the SPA smoke test below.
          #
          # Release B: /performance, /logs and /settings were Jinja pages and
          # are 404 now. These are the SPA's six workspaces -- every one is a
          # real server route (spa.py registers them so a bookmark or a hard
          # reload resolves before Angular loads), so 200 here means the
          # bundle is actually being served for each of them.
          check "http://localhost:1234/dashboard" "200" "dashboard"
          check "http://localhost:1234/trades"    "200" "trades"
          check "http://localhost:1234/analytics" "200" "analytics"
          check "http://localhost:1234/risk"      "200" "risk"
          check "http://localhost:1234/watchlist" "200" "watchlist"
          check "http://localhost:1234/system"    "200" "system"

          if [ -n "$FAILED" ]; then
            echo ""
            echo "FAILED routes:$FAILED"
            exit 1
          fi
          echo "All routes OK."

      # ── The SPA, in the artifact that actually ships ────────────────────
      # Everything above this point tests Jinja. Nothing tested the SPA, and
      # the SPA is what users will see after Release A.
      #
      # This matters more than an ordinary smoke test because of WHERE the
      # bundle comes from: static/app/ is gitignored and produced only by the
      # Dockerfile's frontend stage, so no test suite has ever seen the
      # artifact that deploys. NG54's acceptance walk found the built SPA
      # served a black screen -- <base href="/"> against a bundle mounted at
      # /app/, so every asset 404ed -- with 1537 Python and 294 Angular tests
      # green over it. This step fetches the real index.html and follows every
      # asset URL it declares, which is the one thing that catches that.
      - name: SPA smoke test — the built bundle actually loads
        run: |
          python scripts/dev/smoke_spa.py \
            --url http://127.0.0.1:1234 \
            --user ci --password ci-secret

      - name: Verify container stayed healthy throughout the test
        run: |
          STATE=$(docker inspect --format='{{.State.Status}}' swing-bot-admin-ci)
          if [ "$STATE" != "running" ]; then
            echo "FAIL: container exited unexpectedly (state: $STATE)"
            docker logs swing-bot-admin-ci
            exit 1
          fi
          echo "OK: container still running (state: $STATE)"

      - name: Dump container logs on failure
        if: failure()
        run: docker logs swing-bot-admin-ci

      - name: Tear down admin container
        if: always()
        run: docker rm -f swing-bot-admin-ci || true

      # ── Publish ─────────────────────────────────────────────────────────
      # Last, and only on a green run: everything above proved THIS image
      # works, and re-tagging the local one is what guarantees the bytes
      # that ship are the bytes that passed. A second `docker build` here
      # would look equivalent and would not be -- a cache miss, a moved
      # base-image tag or a dependency resolving differently all produce a
      # different artifact from the one just tested.
      #
      # Only on a real push to main. A pull_request or a manual run against
      # a branch still gets every check above, it just doesn't publish.
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # No secret to create: GITHUB_TOKEN is minted per-run and scoped by
          # the `packages: write` permission above.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          IMAGE="${{ steps.imagename.outputs.image }}"
          TAG="${{ steps.imagename.outputs.tag }}"
          docker tag swing-bot:ci "$IMAGE:$TAG"
          docker tag swing-bot:ci "$IMAGE:latest"
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          echo "Pushed $IMAGE:$TAG and $IMAGE:latest"

  # ── 4. Clean up old images on the server ────────────────────────────────────
  # Runs BEFORE deploy, not after, and does not wait on container-healthcheck
  # -- it needs nothing this run built, so it starts immediately alongside
  # test/frontend/container-healthcheck instead of sitting on the critical
  # path behind them. The point is to free disk on the Hetzner box before
  # deploy tries to pull the new image, not to tidy up afterwards: on a small
  # instance, a disk that's already full from old images is exactly what
  # makes a `docker pull` fail, and finding that out mid-deploy is worse than
  # finding it out here.
  #
  # deploy.sh also runs `docker image prune -f` after every deploy, but that
  # is DANGLING images only (untagged, no container) -- it never touches the
  # image the PREVIOUS deploy pulled. Each deploy pulls a new immutable
  # sha-* tag alongside the old one, and the old tag stays on disk, still
  # tagged, forever; `docker image prune -f` cannot see it. That's the
  # unbounded leak this job closes: one sha-tagged layer set per push to
  # main, otherwise.
  #
  # `-a` (all unused images, not just dangling) is what actually reaches
  # those old tags, and it is safe unconditionally: Docker refuses to remove
  # any image still referenced by a container, running or stopped, so
  # whatever `bot`/`admin` are running RIGHT NOW when this job runs can never
  # be pruned out from under them -- deploy hasn't pulled the new one yet, so
  # the currently-live containers are exactly what's protected. No age
  # filter or keep-N bookkeeping needed here -- unlike GHCR
  # (registry-retention.yml), where a version can outlive every container
  # that used it, the host always has at most one running image per service,
  # so "unused" and "safe to delete" are the same test.
  cleanup:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Prune unused images over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_SSH_PORT || 22 }}
          script_stop: true
          script: |
            echo "Disk usage before prune:"
            docker system df
            docker image prune -af
            echo "Disk usage after prune:"
            docker system df

  # ── 5. Deploy ────────────────────────────────────────────────────────────
  # SSHes into the Hetzner server, which PULLS the image container-healthcheck
  # published and restarts both services -- waiting for health checks to pass
  # before returning (see deploy/deploy.sh). The server no longer builds
  # anything.
  #
  # needs container-healthcheck (the image to pull), cleanup (the disk space
  # to pull it into), AND compose-lint (a docker-compose.yml that still
  # parses in every profile -- deploy.sh runs `docker compose up` on the
  # server, so a broken compose file fails there instead of here otherwise).
  # Cleanup moved to run from the start of the workflow rather than after
  # deploy specifically so the box's disk is freed BEFORE this job asks it to
  # pull a new image -- a disk that's already full is exactly what makes a
  # `docker pull` fail, and finding that out mid-deploy is worse than finding
  # it out before. That guarantee only holds if this job actually waits for
  # cleanup to finish rather than merely starting after it by convention:
  # without this in `needs`, the two jobs race, and nothing stops the pull
  # from landing before the prune does on the exact disk-is-nearly-full run
  # this ordering exists to protect.
  deploy:
    needs: [container-healthcheck, cleanup, compose-lint]
    # Skip on a manual run against a branch, where nothing was published --
    # deploying would silently re-run whatever :latest currently points at.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_SSH_PORT || 22 }}
          script_stop: true
          # envs= is how appleboy/ssh-action forwards a value into the remote
          # shell; interpolating it into the script text directly would put
          # the tag in the command line of a process on the server.
          envs: SWING_BOT_IMAGE,APP_DIR
          script: |
            bash "$APP_DIR/deploy/deploy.sh"
        env:
          # The immutable SHA tag, never :latest. This is what makes the
          # deploy reproducible: the server runs exactly the artifact this
          # run tested, even if another push lands while this one is in
          # flight and moves :latest underneath it.
          SWING_BOT_IMAGE: ${{ needs.container-healthcheck.outputs.image }}:${{ needs.container-healthcheck.outputs.tag }}
          # Where the checkout lives on the server. Overridable via the
          # HETZNER_APP_DIR secret without editing this file.
          #
          # The default is HYPHENATED and must stay that way. An earlier
          # revision of this block changed it to /opt/swingbot, on the
          # stated grounds that the hyphenated path was wrong. It is not:
          # deploy/hetzner-setup.sh:30 creates `APP_DIR="/opt/swing-bot"`,
          # every path in docs/DEPLOY_HETZNER.md matches, and on the box itself
          # `ls /opt/swingbot` answers "No such file or directory" while the
          # shell sits in /opt/swing-bot. The un-hyphenated spelling came
          # from a probe that used it, got ENOENT for that reason, and was
          # read as evidence for the layout it was actually disproving.
          APP_DIR: ${{ secrets.HETZNER_APP_DIR || '/opt/swing-bot' }}

name: Deploy Discord Swing Trade Bot to Hetzner

# Runs on every push to main, plus lets you trigger a deploy manually
# from the Actions tab (e.g. to re-deploy without a new commit, or to
# pick a different branch/tag via workflow_dispatch's ref selector).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # ── 1. Python: compile, then the actual test suite ─────────────────────────
  #
  # This job replaced two (`sanity-check` and `test`) that each did their own
  # full `pip install -r requirements.txt` — pandas, numpy, matplotlib, scipy,
  # discord.py — uncached, from scratch, in parallel, for the same result.
  # Installing the dependency set once is the single biggest saving available
  # here; everything the old sanity-check proved (does it import?) is proved
  # more thoroughly by the suite below failing at collection.
  #
  # It also dropped three hardcoded-list checks that had quietly stopped
  # earning their keep:
  #   - a "required symbol" list, subsumed by 1549 tests that call those
  #     symbols rather than merely assert they exist;
  #   - a "config key" list, subsumed by tests/admin/test_config_flags.py;
  #   - a "Flask route coverage" list of 23 endpoint names, which had drifted
  #     badly — the templates reference 44, and every `pages.*` one was
  #     missing, so it was passing while covering half of what it claimed.
  #     Now tests/admin/test_template_endpoints.py, which DERIVES the list
  #     from the templates and therefore cannot drift.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # uv, with its cache persisted between runs. Same installer the
      # Dockerfile uses, for the same reason: it resolves and downloads in
      # parallel instead of pip's one-at-a-time fetch. The cache key is the
      # pinned requirements file, so a run that changes no dependency
      # reinstalls nothing from the network.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      # Catches truncated or corrupted files anywhere in the tree, including
      # modules nothing imports — which is the one thing the suite cannot do,
      # since it only reaches what it imports. Replaces a 15-line inline
      # heredoc that did the same thing with ast.parse.
      - name: Compile every module
        run: python -m compileall -q swingbot bot.py admin_ui.py scripts tests

      # Not piped: testrun.py exits 1 on failure, and a pipe would substitute
      # the exit status of whatever it fed.
      - name: Test suite
        run: python scripts/testrun.py full

      # testrun.py prints a one-line verdict and writes the tracebacks to a
      # file -- which is right for a terminal and useless in CI, where a red
      # run gave nothing but a node id and no way to see why. Upload it.
      - name: Upload pytest log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: .pytest-last-run.log
          if-no-files-found: warn
          retention-days: 7

  # ── 2b. The frontend ───────────────────────────────────────────────────────
  # The Angular suite and a real production build. The build is not redundant
  # with the Docker one below: this fails in ~1 minute with a readable
  # TypeScript error, where the Docker stage fails several minutes in with the
  # same error buried in build output. It also runs in parallel with `test`.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci`, not `npm install`: it installs exactly what package-lock
      # pins, which is the same guarantee the Dockerfile's frontend stage
      # relies on. If these two ever resolve different trees, the thing that
      # was tested is not the thing that ships.
      - name: Install
        run: npm ci

      - name: Unit tests
        run: npx ng test --watch=false

      - name: Production build
        run: npm run build

      # The base href is what NG54's blocker came down to: the bundle is
      # served from /app/, and index.html's asset URLs resolve against
      # whatever <base href> the build stamped. Asserting it on the real build
      # output catches a regression here rather than in a browser after
      # deploy. The runtime half -- that the server answers those URLs -- is
      # the SPA smoke test in the next job.
      - name: Built index.html points at the path Flask serves
        run: |
          INDEX=dist/frontend/browser/index.html
          test -f "$INDEX" || { echo "FAIL: no index.html at $INDEX"; exit 1; }
          if ! grep -q '<base href="/app/">' "$INDEX"; then
            echo "FAIL: expected <base href=\"/app/\"> in the built index.html"
            echo "Found: $(grep -o '<base[^>]*>' "$INDEX" || echo 'no <base> tag at all')"
            echo "spa.py serves the bundle from /app/. A mismatch means every"
            echo "asset 404s and the SPA renders a black screen."
            exit 1
          fi
          echo "OK: <base href=\"/app/\">"

  # ── 3. Docker build + container health ────────────────────────────────────
  # Builds the real Docker image (same Dockerfile used in production) and
  # actually starts both entrypoints to prove the containers come up
  # healthy.  Catches:
  #   - Dockerfile or requirements.txt breakage that a plain `pip install`
  #     in the earlier jobs wouldn't catch (e.g. system-level deps).
  #   - admin_ui.py failing to bind / Flask crashing on startup.
  #   - Auth gate regression (unauthenticated browser request must redirect
  #     to /login, not serve the dashboard; wrong credentials still 401).
  #   - Any route returning 5xx instead of 200.
  container-healthcheck:
    needs: [test, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # BuildKit is required for --mount=type=cache in the Dockerfile.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Layer cache: keyed on Dockerfile + requirements.txt so a
      # source-only change reuses the cached pip/uv layer entirely.
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: swing-bot:ci
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # Without the move the cache directory grows unboundedly across runs.
      - name: Rotate build cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # ── Entrypoint import checks (no network, no Discord token needed) ──
      - name: bot.py — entrypoint imports cleanly inside the image
        run: |
          docker run --rm \
            -e DISCORD_TOKEN=ci-stub \
            -e DISCORD_CHANNEL_TRADES_ID=0 \
            -e DISCORD_CHANNEL_TRADES_HISTORY_ID=0 \
            -e DISCORD_CHANNEL_RETROSPECTIVE_ID=0 \
            swing-bot:ci \
            python -c "import bot; print('bot.py: OK')"

      - name: admin_ui.py — entrypoint imports cleanly inside the image
        run: |
          docker run --rm \
            -e DISCORD_TOKEN=ci-stub \
            -e ADMIN_USERNAME=ci \
            -e ADMIN_PASSWORD=ci-secret \
            swing-bot:ci \
            python -c "from swingbot.admin.app import app, main; print('admin_ui.py: OK')"

      # ── Admin container smoke test ──────────────────────────────────────
      - name: Start admin container
        run: |
          docker run -d \
            --name swing-bot-admin-ci \
            -p 1234:1234 \
            -e DISCORD_TOKEN=ci-stub \
            -e DISCORD_CHANNEL_TRADES_ID=0 \
            -e DISCORD_CHANNEL_TRADES_HISTORY_ID=0 \
            -e DISCORD_CHANNEL_RETROSPECTIVE_ID=0 \
            -e ADMIN_USERNAME=ci \
            -e ADMIN_PASSWORD=ci-secret \
            -e ADMIN_PORT=1234 \
            swing-bot:ci \
            python admin_ui.py

      - name: Wait for admin UI to become available (up to 30 s)
        run: |
          echo "Waiting for admin UI on :1234..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:1234/ || true)
            if echo "$STATUS" | grep -qE "^(200|401|302)$"; then
              echo "Admin UI up — HTTP $STATUS after ${i}s"
              exit 0
            fi
            echo "  [${i}/30] HTTP '${STATUS:-no response}' — retrying in 1s..."
            sleep 1
          done
          echo "Admin UI did not respond within 30 s — dumping logs:"
          docker logs swing-bot-admin-ci
          exit 1

      - name: Auth gate — unauthenticated browser request must redirect to /login
        run: |
          RESP=$(curl -s -D - -o /dev/null http://localhost:1234/)
          STATUS=$(echo "$RESP" | head -1 | grep -oE "[0-9]{3}")
          if [ "$STATUS" != "302" ]; then
            echo "FAIL: expected HTTP 302 (redirect to /login) without credentials, got HTTP $STATUS"
            exit 1
          fi
          LOCATION=$(echo "$RESP" | grep -i "^location:" | tr -d "\r" | awk '{print $2}')
          if ! echo "$LOCATION" | grep -q "/login"; then
            echo "FAIL: expected redirect Location to contain /login, got: '$LOCATION'"
            exit 1
          fi
          echo "OK: unauthenticated request redirected to $LOCATION"

      - name: Auth gate — /login page itself must be reachable without credentials
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:1234/login)
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: expected HTTP 200 for /login without credentials, got HTTP $STATUS"
            exit 1
          fi
          echo "OK: /login reachable"

      - name: Auth gate — wrong Basic Auth credentials must still return 401
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -u "ci:wrong-password" http://localhost:1234/)
          if [ "$STATUS" != "401" ]; then
            echo "FAIL: expected HTTP 401 with wrong Basic Auth credentials, got HTTP $STATUS"
            exit 1
          fi
          echo "OK: wrong credentials rejected with 401"

      - name: Route smoke test — all key pages must return 200 with valid credentials
        run: |
          AUTH="ci:ci-secret"
          FAILED=""

          check() {
            local url="$1" exp="$2" label="$3"
            local status
            status=$(curl -s -o /tmp/ci_body.html -w "%{http_code}" -u "$AUTH" "$url")
            if [ "$status" = "$exp" ]; then
              echo "  OK  $label  ->  HTTP $status"
            else
              echo "  FAIL $label: expected HTTP $exp, got HTTP $status"
              # Show the first error line from the response body to help debug
              grep -i "error\|traceback\|exception" /tmp/ci_body.html | head -3 || true
              FAILED="$FAILED $label"
            fi
          }

          # `/` is NOT 200 any more. Since NG53 the front door is behind the
          # ADMIN_UI flag, which defaults to spa, and the image now contains a
          # built bundle -- so `/` redirects to /cockpit. This step asserted
          # 200 and would have failed every build, blocking every deploy. The
          # redirect itself is checked by the SPA smoke test below; the
          # dashboard keeps its own URL, which is what is checked here.
          check "http://localhost:1234/dashboard"   "200" "jinja dashboard"
          check "http://localhost:1234/performance" "200" "performance / stats"
          check "http://localhost:1234/logs"        "200" "logs"
          check "http://localhost:1234/settings"    "200" "settings"
          check "http://localhost:1234/watchlist"   "200" "watchlist"

          if [ -n "$FAILED" ]; then
            echo ""
            echo "FAILED routes:$FAILED"
            exit 1
          fi
          echo "All routes OK."

      # ── The SPA, in the artifact that actually ships ────────────────────
      # Everything above this point tests Jinja. Nothing tested the SPA, and
      # the SPA is what users will see after Release A.
      #
      # This matters more than an ordinary smoke test because of WHERE the
      # bundle comes from: static/app/ is gitignored and produced only by the
      # Dockerfile's frontend stage, so no test suite has ever seen the
      # artifact that deploys. NG54's acceptance walk found the built SPA
      # served a black screen -- <base href="/"> against a bundle mounted at
      # /app/, so every asset 404ed -- with 1537 Python and 294 Angular tests
      # green over it. This step fetches the real index.html and follows every
      # asset URL it declares, which is the one thing that catches that.
      - name: SPA smoke test — the built bundle actually loads
        run: |
          python scripts/smoke_spa.py \
            --url http://127.0.0.1:1234 \
            --user ci --password ci-secret \
            --expect spa

      - name: Verify container stayed healthy throughout the test
        run: |
          STATE=$(docker inspect --format='{{.State.Status}}' swing-bot-admin-ci)
          if [ "$STATE" != "running" ]; then
            echo "FAIL: container exited unexpectedly (state: $STATE)"
            docker logs swing-bot-admin-ci
            exit 1
          fi
          echo "OK: container still running (state: $STATE)"

      - name: Dump container logs on failure
        if: failure()
        run: docker logs swing-bot-admin-ci

      - name: Tear down admin container
        if: always()
        run: docker rm -f swing-bot-admin-ci || true

  # ── 4. Deploy ──────────────────────────────────────────────────────────────
  # Only runs after all three check jobs pass. SSHes into the Hetzner
  # server and runs the deploy script, which pulls latest, rebuilds, and
  # restarts both services -- waiting for health checks to pass before
  # returning (see deploy/deploy.sh).
  deploy:
    needs: [container-healthcheck]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_SSH_PORT || 22 }}
          script_stop: true
          script: |
            bash /opt/swing-bot/deploy/deploy.sh

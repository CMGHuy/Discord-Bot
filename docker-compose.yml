# Two services built from the same image (see Dockerfile):
#   - bot:   runs the Discord bot itself (python bot.py -> swingbot/)
#   - admin: a small authenticated web UI (python admin_ui.py ->
#            swingbot/admin/app.py) to clear all open paper trades,
#            view/edit .env, and inspect any trade in full detail --
#            without needing shell access to the container.
#
# Both services bind-mount this whole project directory to /app, so the
# swingbot/ source, data/ (trades.json, state.json, account.json,
# watchlist.json), .env, and exports/ are all shared between them and
# persisted on the host -- no separate data volume needed.
#
# Quick start:
#   1. cp .env.example .env   and fill in DISCORD_TOKEN, DISCORD_CHANNEL_ID, etc.
#   2. Set ADMIN_USERNAME / ADMIN_PASSWORD below (or export them in your
#      shell) -- do NOT leave the defaults in place.
#   3. docker compose up -d --build
#   4. Bot logs:   docker compose logs -f bot
#      Admin UI:   http://localhost:1234  (or your server's address)
#
# Development builds locally; PRODUCTION DOES NOT BUILD. CI builds the image,
# pushes it to GHCR, and deploy/deploy.sh pulls it and runs `up --no-build`
# with SWING_BOT_IMAGE pointing at the exact tag. Set that variable yourself
# to run a specific published build locally:
#   SWING_BOT_IMAGE=ghcr.io/<owner>/swing-bot:<sha> docker compose up -d
#
# Only state is mounted from the host (data/, logs/, exports/, market_data/,
# .env). The code and the SPA bundle come from the image and nothing on the
# host may shadow them -- see the volumes: comment on the bot service.
#
# After editing .env from the admin UI, restart the bot to pick up the
# change: click "Restart bot container" in the UI (requires the Docker
# socket mount below), or run `docker compose restart bot`.

services:
  bot:
    # The image is the deployable. CI builds it, pushes it to GHCR, and the
    # server pulls it by digest-pinned tag -- SWING_BOT_IMAGE is exported by
    # deploy/deploy.sh. The local default keeps `docker compose up --build`
    # working unchanged for development.
    image: ${SWING_BOT_IMAGE:-swing-bot:latest}
    # Kept so a developer can still build locally. The server never builds:
    # deploy.sh pulls and runs `up --no-build`.
    build: .
    container_name: swing-bot
    restart: unless-stopped
    env_file:
      - .env
    # STATE ONLY. Never mount the source tree over /app.
    #
    # This used to be `.:/app` plus an anonymous volume to punch the SPA
    # bundle back through it, and that pairing is what froze the admin UI on
    # a months-old bundle: an anonymous volume is initialised from the image
    # exactly once, and Compose carries it to every replacement container.
    # Mounting the repo also makes an image pull meaningless -- the host
    # checkout simply overwrites whatever the image shipped, so you would
    # deploy an artifact and then replace it at runtime.
    #
    # So the code, the SPA bundle and scripts/ all come from the image, and
    # the host contributes only things that must OUTLIVE it. Every path here
    # is _PROJECT_ROOT-relative in swingbot/config.py:63-67.
    volumes:
      - ./data:/app/data                 # trades.json, account.json, state.json, watchlist.json
      - ./logs:/app/logs
      - ./exports:/app/exports           # generated charts
      - ./market_data:/app/market_data   # OHLCV cache (MARKET_DATA_AUTO_REFRESH)
      # Two FILE mounts, not the directory that holds them -- mounting the
      # project root is what this whole comment exists to prevent.
      #
      # .env is read at startup, watched by mtime for SIGHUP reloads, and
      # REWRITTEN IN PLACE by the admin UI's settings page
      # (admin/helpers.py:114). In-place truncate-and-write keeps the inode,
      # which is what makes a single-file bind mount safe here.
      #
      # .env.bak is the backup that same code writes beside it. Without its
      # own mount it lands in the container's writable layer and is lost on
      # the next deploy -- i.e. the backup would silently not be a backup.
      # deploy.sh touches both before `up`, because Docker creates a
      # DIRECTORY at a bind-mount source that does not exist yet.
      - ./.env:/app/.env
      - ./.env.bak:/app/.env.bak
    # Chart generation (matplotlib/mplfinance) is CPU-only and headless;
    # no GPU or display needed.
    #
    # Health check: signal 0 to PID 1 confirms the Python process is still
    # alive. This catches silent crashes that `restart: unless-stopped`
    # would otherwise not catch until the next OOM kill or system reboot.
    # start_period gives the bot time to connect to Discord before the
    # check starts counting failures.
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 2>/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  admin:
    # No 'build:' here -- same image as the bot, so a local `up --build`
    # compiles once rather than twice and a deploy pulls one artifact for
    # both services. This is also what guarantees the two can never drift
    # onto different versions of the code.
    image: ${SWING_BOT_IMAGE:-swing-bot:latest}
    container_name: swing-bot-admin
    restart: unless-stopped
    command: ["python", "admin_ui.py"]
    env_file:
      - .env
    environment:
      # Change these -- the defaults in swingbot/admin/app.py are not
      # safe to leave in place if this port is reachable by anyone but you.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      ADMIN_PORT: ${ADMIN_PORT:-1234}
      BOT_CONTAINER_NAME: swing-bot
    # Identical state mounts to the bot service, and that is the point: the
    # two processes share one data/ directory, so the admin UI reads exactly
    # the trades.json the bot is writing. See the bot service above for why
    # the source tree is NOT mounted and why .env/.env.bak are file mounts.
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./exports:/app/exports
      - ./market_data:/app/market_data
      - ./.env:/app/.env
      - ./.env.bak:/app/.env.bak
      # Optional: lets the admin UI's "Restart bot container" button
      # actually restart the bot service via the Docker API. Remove this
      # line if you'd rather not grant the admin container access to the
      # host's Docker socket -- the rest of the UI (clear open trades,
      # edit .env, trade detail) works fine without it; you'd just
      # restart the bot yourself with `docker compose restart bot` after
      # saving .env.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${ADMIN_PORT:-1234}:${ADMIN_PORT:-1234}"
    # Health check: asks Flask for the root page and accepts 200 (logged
    # in) or 401 (auth gate hit -- server is up). Any other status or a
    # connection refusal means the admin UI is not healthy.
    # curl is installed in the Dockerfile specifically for this check.
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          curl -s -o /dev/null -w '%{http_code}' http://localhost:${ADMIN_PORT:-1234}/
          | grep -qE '^(200|401|302)$'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      bot:
        condition: service_healthy


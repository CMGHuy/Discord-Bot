# Test suites: the single source of truth for "which tests verify which feature".
#
# A suite is a group of tests/ subdirectories you can run on their own:
#     python scripts/dev/testrun.py suite <name>        # -n 4, one-line verdict
#     python scripts/dev/testrun.py suites              # list them
# and the CI pipeline (.github/workflows/deploy.yml) runs ONE job per suite, built
# from this file -- add a suite here and the next push has a job for it, with no
# workflow edit. tests/dev/test_suites.py fails when a tests/ directory belongs to
# no suite (or two), a path does not exist, or a suite grows past MAX_TESTS.
#
# Rule, in docs/claude/testing-cost.md "Test suites": when a suite passes MAX_TESTS
# test functions, split it by FEATURE into smaller suites (move the directories, or
# give a feature its own tests/<feature>/ directory) instead of raising the limit.

max_tests = 1200

[suites.charts]
description = "chart/PNG rendering -- alone because rendering dominates wall-clock"
paths = ["tests/charts/"]

[suites.market-data]
description = "OHLCV fetch and cache"
paths = ["tests/marketdata/"]

[suites.market-signals]
description = "the market layer: indicators, entry signals, ATR band"
paths = ["tests/market/"]

[suites.scanning]
description = "the scan engine and everything it posts"
paths = ["tests/scanning/"]

[suites.planning]
description = "trade-plan construction, exits and sizing: tests/planning/ files test_a* .. test_o* and test_q* .. test_z*"
paths = ["tests/planning/test_[a-o]*.py", "tests/planning/test_[q-z]*.py"]

[suites.planning-plans]
description = "the plan engine, plan manager, plan feed and plan params: tests/planning/ files test_p*"
paths = ["tests/planning/test_p*.py"]

# tests/backtesting/ is ~40% of the suite's wall-clock, so it is four legs, cut by
# measured per-file time (~320/290/270/190 CPU-s) rather than by feature -- one leg
# of 136 s was the CI critical path. The three file globs are by file-name letter and
# are exhaustive (a-z), so a new test_*.py lands in a leg without a manifest edit.
[suites.backtesting-arms]
description = "backtesting arms/, instrument/, screen/ subpackages"
paths = ["tests/backtesting/arms/", "tests/backtesting/instrument/", "tests/backtesting/screen/"]

[suites.backtesting-scenarios]
description = "backtesting scenario replay (test_scenario_parallel.py is ~1/5 of the area)"
paths = ["tests/backtesting/test_s*.py"]

[suites.backtesting-a-k]
description = "backtesting top-level files test_a* .. test_k* (acceptance, backtest, compression, headroom, knob)"
paths = ["tests/backtesting/test_[a-k]*.py"]

[suites.backtesting-l-z]
description = "backtesting top-level files test_l* .. test_z*, minus test_s* (validate_component, v131/v139 witnesses)"
paths = ["tests/backtesting/test_[l-r]*.py", "tests/backtesting/test_[t-z]*.py"]

[suites.edge]
description = "edge modules"
paths = ["tests/edge/"]

[suites.analytics]
description = "analytics, journal metrics and reports"
paths = ["tests/analytics/"]

[suites.storage]
description = "Postgres stores, migrations, and the paper trade log"
paths = ["tests/db/", "tests/tracking/"]

# tests/admin/ is split by feature: the api_v1 endpoint files (test_api*) vs the rest
# (atomic lifecycle commands, jobs, listeners, settings, SPA serving). The globs are
# exhaustive over test_*.py, so a new file lands in a leg without a manifest edit.
[suites.admin]
description = "Flask admin API endpoints (tests/admin/test_api*)"
paths = ["tests/admin/test_api*.py"]
# NOTE: a future tests/admin/test_ap<not i>*.py file would be unowned and fail test_suites.

[suites.admin-core]
description = "Flask admin internals: lifecycle commands, jobs, listeners, settings, SPA serving"
paths = ["tests/admin/test_[b-z]*.py", "tests/admin/test_a[!p]*.py"]

[suites.admin-perf]
description = "v205 admin read performance: SQL tally, Server-Timing, goldens and budgets of the profiled endpoints"
paths = ["tests/admin_perf/"]

[suites.live-api]
description = "v202 GET /api/v1/live: heat, plans awaiting order, killswitch, activity feed"
paths = ["tests/live_api/"]

[suites.discord]
description = "slash commands, embeds/presentation, infra"
paths = ["tests/commands/", "tests/presentation/", "tests/infra/"]

[suites.tooling]
description = "operational and analysis scripts under scripts/"
paths = ["tests/scripts/"]

[suites.dev-setup]
description = "Claude/Codex hooks and the dev tooling itself (incl. this file's guard)"
paths = ["tests/hooks/", "tests/dev/"]

[suites.backtest-scripts]
description = "scripts/backtest/* -- measure_*, run_backtest_range, tune_strategy, screen_idea and friends"
paths = ["tests/backtest_scripts/"]

[suites.config]
description = "Config schema/keys -- the loose tests/test_*.py files (CI used to skip these)"
paths = ["tests/test_*.py"]

[suites.history-store]
description = "v162 Alpaca history store: read seam, backfill, update, training switch"
paths = ["tests/history_store/"]

[suites.scout]
description = "v161 trade scout: book export, autopsy, merge, generator roles"
paths = ["tests/scout/"]

[suites.refresher]
description = "v201 admin market refresher: contract, process, quote cycle, never-fetch request door"
paths = ["tests/refresher/", "tests/admin_market/"]

<div class="shell" [class.railed]="railed()" [class.overlay]="overlay()"
     [class.overlay-open]="overlayOpen()">
  <!-- Below sm the sidebar is an overlay, so something has to summon it. -->
  @if (overlay()) {
    <button class="menu-button" type="button" aria-label="Open navigation" (click)="openOverlay()">
      <sb-icon name="menu" />
    </button>
  }

  <nav class="sidebar" [attr.aria-hidden]="overlay() && !overlayOpen() ? 'true' : null">
    <div class="mark">
      <img
        class="avatar"
        src="bot-profile.png"
        srcset="bot-profile.png 1x, bot-profile@2x.png 2x"
        alt=""
        width="22"
        height="22"
      />
      <!-- Collapsed, the mark is the avatar alone: a name clipped to three
           letters reads as a rendering fault rather than as a choice. -->
      <span class="name">swingbot</span>
      <span class="tag">paper</span>
    </div>

    <ul class="nav">
      @for (entry of nav; track entry.path) {
        <li>
          <a
            [routerLink]="entry.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: false }"
            [attr.aria-label]="entry.label"
            [attr.title]="railed() ? entry.label : null"
            (click)="closeOverlay()"
          >
            <sb-icon [name]="entry.icon" />
            <!-- The label stays in the DOM on the rail and is hidden
                 visually, so the accessible name survives the collapse. -->
            <span class="label">{{ entry.label }}</span>
          </a>
        </li>
      }
    </ul>

    <!-- Not shown on the phone overlay: there it would sit under a sheet
         that a navigation is about to dismiss. -->
    @if (!overlay()) {
      <button
        class="collapse"
        type="button"
        [attr.aria-label]="railed() ? 'Expand sidebar' : 'Collapse sidebar'"
        [attr.aria-pressed]="railed()"
        (click)="toggleSidebar()"
      >
        <sb-icon [name]="railed() ? 'expand' : 'collapse'" />
      </button>
    }
  </nav>

  <!-- Tapping away from the overlay dismisses it, which is what every phone
       user already expects a scrim to do. -->
  @if (overlay() && overlayOpen()) {
    <div class="scrim" (click)="closeOverlay()"></div>
  }

  <div class="main">
    <header class="topbar">
      <!-- Engaged killswitch is shell-level and unmissable: it means the bot
           has stopped taking positions, which is true no matter which
           workspace happens to be open. -->
      @if (killswitchOn()) {
        <span class="killswitch" role="alert">KILLSWITCH ENGAGED</span>
      }
      <div class="spacer"></div>
      <sb-connection-status
        [state]="connection.state()"
        [botAlive]="connection.botAlive()"
      />
      <sb-profile-menu (signedOut)="logout()" />
    </header>

    <main class="workspace">
      <router-outlet />
    </main>
  </div>

  <sb-toast-host />
</div>

<main class="login">
  <form class="panel" (submit)="submit($event)">
    <h1 class="mark">swingbot</h1>
    <p class="sub">admin</p>

    <sb-text-input
      #usernameField
      label="Username"
      name="username"
      autocomplete="username"
      [value]="username()"
      (valueChange)="username.set($event)"
    />

    <sb-text-input
      label="Password"
      type="password"
      name="password"
      autocomplete="current-password"
      [value]="password()"
      (valueChange)="password.set($event)"
    />

    @if (error(); as message) {
      <p class="error" role="alert">{{ message }}</p>
    }

    <!-- SR63, still true post-v54: TextInput has no `required` to mark (the
         native attribute would land on the host, which the real inner
         input element never sees), so the button's [disabled] below is
         the ONLY enforcement -- not a backstop this time. -->
    <button sb-button variant="primary" type="submit" [disabled]="submitting() || incomplete()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</main>

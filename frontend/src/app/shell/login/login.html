<main class="login">
  <form class="panel" (ngSubmit)="submit()">
    <h1 class="mark">swingbot</h1>
    <p class="sub">admin</p>

    <label class="field">
      <span>Username</span>
      <input
        name="username"
        autocomplete="username"
        required
        autofocus
        [ngModel]="username()"
        (ngModelChange)="username.set($event)"
      />
    </label>

    <label class="field">
      <span>Password</span>
      <input
        name="password"
        type="password"
        autocomplete="current-password"
        required
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
      />
    </label>

    @if (error(); as message) {
      <p class="error" role="alert">{{ message }}</p>
    }

    <!-- SR63. login.html:38,42 marked both inputs required; neither was
         here, and the button submitted an empty form to the server just to
         be told no. -->
    <button sb-button variant="primary" type="submit" [disabled]="submitting() || incomplete()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</main>
